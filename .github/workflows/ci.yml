name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: nothing in CI publishes, and a job that needs more
# has to ask for it explicitly.
permissions:
  contents: read

# Supersede an in-flight run on a PR, where only the latest push matters.
# Never on main: cancelling there leaves a merged commit with no green run,
# which is the record branch protection and bisects rely on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: typecheck + boundaries + generated-drift + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14" # matches packageManager in package.json
      # Same step order as release.yml, so what CI proves is what release runs.
      # electrobun links a real webview on Linux and needs these to build.
      - name: Install Linux webview build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify
        run: bun run verify
      # Build here so a broken electrobun.config (a copy source that no longer
      # exists, a missing entrypoint) fails on the PR rather than at release.
      - name: Build
        run: bun run build
